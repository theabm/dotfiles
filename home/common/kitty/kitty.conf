enable_audio_bell no
font_size 15
confirm_os_window_close 0

background_opacity 1.0
include colors-kitty.conf

# ============================================================
# WORKSPACE LAYOUT
# ============================================================

enabled_layouts splits,stack


# ============================================================
# CREATE / CLOSE SPLITS
# ============================================================

# Create a new split automatically
map kitty_mod+enter launch --cwd=current --location=split

# Close current split
map kitty_mod+x close_window


# ============================================================
# NAVIGATE SPLITS
# ============================================================

# Vim-style directional navigation
map kitty_mod+h neighboring_window left
map kitty_mod+j neighboring_window down
map kitty_mod+k neighboring_window up
map kitty_mod+l neighboring_window right


# ============================================================
# ZOOM CURRENT SPLIT
# ============================================================

# Maximize current window; press again to restore
map kitty_mod+z toggle_layout stack


# ============================================================
# NAVIGATE PROJECTS / TABS
# ============================================================

# Previous project
map kitty_mod+u previous_tab

# Next project
map kitty_mod+i next_tab

# Interactive selector for open projects
map kitty_mod+g select_tab


# ============================================================
# PROJECT LAUNCHER
# ============================================================

# Create a standard Codex + shell + lazygit workspace for the
# directory of the currently focused terminal.
#
# The temporary overlay is granted remote-control access so
# kproj can create the new tab and splits. Remote control is
# NOT enabled globally.
map kitty_mod+p launch --type=overlay --allow-remote-control --cwd=current ~/.local/bin/kproj
